
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Status Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Machine Safety Calculator</h1>

        <label>Temperature (°C)</label>
        <input type="number" id="temperature" placeholder="Enter temperature">

        <label>Oil Level (%)</label>
        <input type="number" id="oilLevel" placeholder="Enter oil level">

        <label>Pressure (bar)</label>
        <input type="number" id="pressure" placeholder="Enter pressure">

        <button onclick="calculateSafety()">Check Safety Status</button>

        <div id="result"></div>

    </div>

    <script src="script.js"></script>
</body>
</html>
